[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "help-desk-ticket-analytics"
version = "0.1.0"
description = "SQL and Python analytics for fictional help-desk ticket data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bright Addey Williams"}]

[project.scripts]
helpdesk-analytics = "helpdesk_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

